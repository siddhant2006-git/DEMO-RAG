version: 1
name: Default Services Procurement Pack
rules:
  - id: REQ-TURNOVER
    label: Minimum average annual turnover
    severity: CRITICAL
    weight: 20
    fact: financials.avg_annual_turnover
    operator: gte
    source_priority: [government, document]
    threshold_from: tender.turnover_requirement

  - id: REQ-GST-ACTIVE
    label: GST registration must be active
    severity: CRITICAL
    weight: 15
    fact: gst.status
    operator: eq
    value: ACTIVE
    source_priority: [government]

  - id: REQ-EXPERIENCE
    label: Minimum years of relevant service delivery experience
    severity: MAJOR
    weight: 20
    fact: experience.years
    operator: gte
    source_priority: [document]
    threshold_from: tender.experience_requirement

  - id: REQ-CERTIFICATION
    label: Required quality certification held (e.g. ISO)
    severity: MAJOR
    weight: 10
    fact: certification.iso_certified
    operator: eq
    value: true
    source_priority: [document]

  - id: REQ-MSME
    label: Udyam certificate valid if claiming MSME benefit
    severity: MAJOR
    weight: 10
    fact: udyam.valid
    operator: eq
    value: true
    applies_if: bid.claims_msme_benefit == true

  - id: REQ-DEBARMENT
    label: Vendor must not be debarred / blacklisted
    severity: BLOCKER
    weight: 40
    fact: debarment.listed
    operator: eq
    value: false
    source_priority: [government]
