events {}

http {
  server {
    listen 80;
    client_max_body_size 50m;

    location /api/ {
      # No trailing slash on the proxy_pass target: nginx forwards the full
      # matched URI (/api/v1/...) unchanged instead of stripping /api/ —
      # every backend route is mounted under /api/v1 (see app/main.py).
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend:5173/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
