version: 1
name: Default Works (Construction) Procurement Pack
rules:
  - id: REQ-TURNOVER
    label: Minimum average annual turnover
    severity: CRITICAL
    weight: 20
    fact: financials.avg_annual_turnover
    operator: gte
    source_priority: [government, document]
    threshold_from: tender.turnover_requirement

  - id: REQ-GST-ACTIVE
    label: GST registration must be active
    severity: CRITICAL
    weight: 15
    fact: gst.status
    operator: eq
    value: ACTIVE
    source_priority: [government]

  - id: REQ-SIMILAR-WORK-VALUE
    label: Minimum value of similar completed works
    severity: CRITICAL
    weight: 25
    fact: experience.similar_work_value
    operator: gte
    source_priority: [document]
    threshold_from: tender.similar_work_value_requirement

  - id: REQ-EMD
    label: Earnest Money Deposit submitted
    severity: BLOCKER
    weight: 15
    fact: financials.emd_submitted
    operator: eq
    value: true
    source_priority: [document]

  - id: REQ-MSME
    label: Udyam certificate valid if claiming MSME benefit
    severity: MAJOR
    weight: 10
    fact: udyam.valid
    operator: eq
    value: true
    applies_if: bid.claims_msme_benefit == true

  - id: REQ-DEBARMENT
    label: Vendor must not be debarred / blacklisted
    severity: BLOCKER
    weight: 40
    fact: debarment.listed
    operator: eq
    value: false
    source_priority: [government]
